syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hurricache.grpc";
option java_outer_classname = "HurriCache";

package hurricache;

// ============================================================================
// Data Payloads & Compression (Low-level binary data and compression)
// ============================================================================

// Binary data of a value with an optimized buffer.
message BinaryPayload {
  oneof data{
    bytes payload = 1 [ctype = CORD]; // Raw bytes of the value (uses CORD for Zero-Copy acceleration)
    int64 intPayload = 2;
    double doublePayload = 3;
    bytes non_cord_payload = 4;
  }
  uint32 size = 5;                  // Payload size in bytes
}

// Binary data of a key.
message KeyBinaryPayload {
  bytes payload = 1;                // Raw bytes of the key
  uint32 size = 2;                  // Key length
}

// Optimization hash hints for fast lookup and data locality in shards.
message KeyHint {
  optional uint32 weak_hash = 1;    // Fast (weak) key hash for primary filtering
  optional uint32 strong_hash = 2;  // Cryptographic/full hash for accuracy and bucket distribution
}

// Data compression metadata.
message CompressedInfo {
  bool enabled = 1;                 // Flag indicating whether the data is compressed
  optional uint32 rawSize = 2;      // Uncompressed raw data size
}

// ============================================================================
// Keys & Values (Key and value structures)
// ============================================================================

// Standard undefined/unordered key.
message Key {
  KeyBinaryPayload payload = 1;               // Key body
  optional CompressedInfo compressionInfo = 2;// Key compression data
  optional KeyHint keyHint = 3;              // Cached hashes
  optional uint32 clientId = 4;             // Owner client ID
}

// Ordered key (used for ORDERED_SET and ORDERED_MAP).
message OrderedKey {
  KeyBinaryPayload payload = 1;               // Key body
  optional uint64 order = 2;                 // Order / Weight for sorting
  optional CompressedInfo compressionInfo = 3;// Compression data
  optional KeyHint keyHint = 4;              // Hash hints
  optional uint32 clientId = 5;             // Client ID
}

// Object lock information.
message LockInfo {
  LockType type = 1;                         // Lock retention type
  optional uint32 lockedBy = 2;              // ID of the client holding the lock
  optional uint64 lockedTill = 3;            // Lock expiration Unix Timestamp (in ms)
}

enum ValueType{
  AUTO = 0;
  BYTES = 1;
  INT = 2;
  DOUBLE = 3;
}

// Unordered scalar value.
message Value {
  BinaryPayload value = 1;                   // Data
  optional CompressedInfo compressionInfo = 2;// Compression metadata
  optional uint64 ttl = 3;                   // Absolute or relative Time-To-Live (TTL)
  optional LockInfo lock_info = 4;           // Current lock status
  optional ValueType value_type = 5;         // Type of data
}

// Ordered value (contains a weight factor).
message OrderedValue {
  BinaryPayload value = 1;                   // Data
  optional uint64 order = 2;                 // Element weight (weight/order, uint64)
  optional CompressedInfo compressionInfo = 3;// Compression
  optional uint64 ttl = 4;                   // Time-To-Live
  optional LockInfo lock_info = 5;           // Lock
  optional ValueType value_type = 6;         // Type of data
}

// ============================================================================
// Basic Requests & Responses (Basic requests/responses)
// ============================================================================

message GetRequest {
  Key key = 1;
}

message ContainerGetRequest {
  Key key = 1;
  Key element_key = 2;
}

message TtlRequest {
  Key key = 1;
  optional uint64 ttl = 2;                   // New Time-To-Live in milliseconds
}

message TtlResponse {
  optional uint64 ttl = 1;                   // Remaining Time-To-Live
}

message ContainerKey{
  oneof key{
    Key container_key = 1;
    uint64 pos = 2;
  }
}

message CreateRequest {
  Key key = 1;
  optional ContainerKey container_key = 2;
  Value value = 3;
}

message UpdateRequest {
  Key key = 1;
  Value value = 2;
}

message UpdateContainerRequest {
  Key key = 1;
  oneof keys{ //subset
    Key element_key = 2; //used for unordered containers
    OrderedKey ordered_element_key = 3; // used for ordered containers
  }
  oneof values {            //used approach of update
    Value value = 4;        //used for direct update case key container key + value
    uint64 new_order = 6;        //used to update order
    int64 delta_order = 7;        //used int/dec order to update order
  }
}

message DeleteRequest {
  Key key = 1;
}

message ExistRequest {
  Key key = 1;
}

message BoolResponse {
  bool value = 1;                            // true - success, false - error/not found
  optional string message = 2;               // Error or status message
}

message IntResponse {
  uint32 size = 1;                           // Size or element count
}

message ValueResponse {
  optional Value value_unordered = 1;        // Scalar or unordered value
  optional OrderedValue value_ordered = 2;   // Weighted value
  optional KeyHint keyHint = 3;              // Current KeyHint
}

message BatchValueResponse {
  repeated Key key_unordered = 1;          // Array of unordered keys
  repeated OrderedKey key_ordered = 2;      // Array of ordered keys
  repeated Value value_unordered = 3;        // Array of unordered values
  repeated OrderedValue value_ordered = 4;   // Array of ordered values
}

message UpdateValueResponse {
  bool result = 1;                            // Success flag
  optional Value value = 2;                  // Previous value only for update. In case of update weigh this value will be sent
}

message KeyHintResponse {
  KeyHint keyHint = 1;
  optional bool relayed = 2;                 // True if message has been relayed to target node.
}

message KeyRangeRequest {
  Key key = 1;
  uint32 start = 3;                          // Start index
  uint32 end = 4;                            // End index
}

message KeyPositionRequest {
  Key key = 1;
  optional ContainerType type = 2;           // Container type

  optional uint64 pos = 3;                   // for ordered containers if pos not specified it means that start from min order for unordered meand that pos=0
  optional uint64 end = 4;                   // for ordered containers if end not specified it means that end by end of order for unordered meand that end=size of container
  bool reverse = 6;                          // Reverse traversal flag
}

// ============================================================================
// Container Definitions & Requests (Containers)
// ============================================================================

// Supported data structure types (containers).
// Applicable containers: VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
enum ContainerType {
  UNDEFINED = 0;
  VECTOR = 1;        // Dynamic array (indexing, fast random access by index)
  LIST = 2;          // Doubly-linked list (fast insert/pop at both ends)
  QUEUE = 3;         // FIFO Queue (Push to tail, Pop from head)
  SET = 4;           // Unordered set of unique elements
  MAP = 5;           // Unordered hash map (Key-Value)
  ORDERED_MAP = 6;   // Ordered map by keys/weights
  ORDERED_SET = 7;   // Ordered set by uint64 weights (SkipList/Tree)
}

message CreateContainerRequest {
  Key key = 1;
  ContainerType type = 2;
  optional uint64 ttl = 3;
  optional LockInfo lock_info = 4;

  repeated Key key_unordered = 5;            // Keys for MAP / ORDERED_MAP
  repeated Value value_unordered = 6;        // Elements for LIST, VECTOR, QUEUE, SET, MAP
  repeated OrderedKey key_ordered = 7;       // Keys for ORDERED_MAP
  repeated OrderedValue value_ordered = 8;   // Weighted elements for ORDERED_SET
}

message AddToRequest {
  Key key = 1;
  optional ContainerType type = 2;
  optional uint64 ttl = 3;
  optional uint32 pos = 4;                   // Insertion position (for VECTOR/LIST)

  repeated Key key_unordered = 5;
  repeated Value value_unordered = 6;
  repeated OrderedKey key_ordered = 7;
  repeated OrderedValue value_ordered = 8;
}

message AddToValRequest {
  Key key = 1;
  optional uint64 ttl = 2;
  bool isBefore = 3;                         // true = insert BEFORE value, false = AFTER
  Value pos = 4;                             // Target value used to locate insertion position
  repeated Value value = 5;                  // Elements to insert
}

message RemoveFromContainerRequest {
  Key key = 1;
  repeated Value values = 3;                 // List of values to remove
  repeated Key keys = 4;                     // List of keys to remove
}

// ============================================================================
// Locking Mechanisms (Lock types and statuses)
// ============================================================================

enum LockType {
  NO_LOCK = 0;       // No lock
  WRITE_LOCK = 1;    // Exclusive write lock
  READ_LOCK = 2;     // Shared read lock
  GLOBAL = 3;        // Global system/shard lock
}

message LockRequest {
  Key key = 1;
  LockType lockType = 2;
  optional uint32 clientId = 3;
  optional uint32 lockDuration = 4;          // Lock duration in ms
}

message UnLockRequest {
  Key key = 1;
  optional uint32 clientId = 2;
}

enum LockStatus {
  OK = 0;
  CANT_LOCK = 1;
  CANT_UNLOCK = 2;
  GENERIC_ERROR = 3;
}

message LockResponse {
  LockStatus result = 1;
  optional string message = 2;
}

message UnlockResponse {
  LockStatus result = 1;
  optional string message = 2;
}

// ============================================================================
// Atomic Operations (Atomic types and CAS)
// ============================================================================

message AtomicValue {
  int64 val = 1;
  optional KeyHint keyHint = 2;
}

message AtomicCasRes {
  bool result = 1;                           // true if exchange succeeded
  optional ValueResponse expected = 2;         // Actual value read in case of failure
}
// Structure for Compare-And-Swap (CAS) operation.
message AtomicCas {
  Key key = 1;
  Value expected = 2;                  // Expected value
  Value toSet = 3;                     // New value to set
  oneof keys{ //subset
    Key element_key = 4; //used for unordered containers
    OrderedKey ordered_element_key = 5; // used for ordered containers
  }
}


// ============================================================================
// Replication & Internal Commands (Replication and WAL binlog)
// ============================================================================

enum ReplicationCommandType {
  LOCK_REQUEST = 0;
  UNLOCK_REQUEST = 1;
  REMOVE = 2;
  CREATE_VALUE = 3;
  UPDATE_VALUE = 4;
  CREATE_CONTAINER = 6;
  REMOVE_FRONT = 7;
  REMOVE_TAIL = 8;
  REMOVE_AT_POSITION = 9;
  ADD_TO_TAIL = 10;
  ADD_TO_FRONT = 11;
  SET_TTL = 12;
  ADD_TO_POSITION = 13;
  REMOVE_FROM_POSITION = 14;
  ATOMIC_EXCHANGE = 15;
  ATOMIC_ADD = 16;
  ATOMIC_SUB = 17;
  ATOMIC_OR = 18;
  ATOMIC_AND = 19;
  ATOMIC_XOR = 20;
  ATOMIC_COMPARE_AND_SET = 21;
  ADD_TO_POSITION_BY_VAL = 22;
  REMOVE_FROM_CONTAINER = 23;
  ADD_TO_CONTAINER = 24;
  REMOVE_FROM_CONTAINER_BY_KEY = 25;
  UPDATE_IN_CONTAINER_BY_KEY = 26;
  UNKNOWN = 27;
}

message BatchCommand {
  optional LockRequest lock_request = 1;
  optional UnLockRequest un_lock_request = 2;
  optional TtlRequest ttl_request = 3;
  optional UpdateRequest update_request = 4;
  optional CreateRequest create_request = 5;
  optional GetRequest get_request = 6;
  optional CreateContainerRequest create_container_request = 7;
  optional KeyPositionRequest key_position_request = 9;
  optional KeyRangeRequest key_range_request = 10;
  optional AddToRequest add_to_list_request = 11;
  optional AddToValRequest add_to_pos_by_val = 14;
  optional RemoveFromContainerRequest remove_from_container_by_key_value = 15;
  optional ContainerGetRequest remove_from_container_by_key = 16;
  optional UpdateContainerRequest update_in_container_by_key = 17;
  optional AtomicCas compare_and_set = 18;
}

message BatchSingleMessage {
  ReplicationCommandType replication_command_type = 1;
  BatchCommand batch_command = 2;
}

message BatchMessage {
  repeated BatchSingleMessage batch_single_messages = 1;
}

// Internal gRPC data replication service between cluster nodes.
service DataReplicationService {
  rpc batchMessage(BatchMessage) returns (BoolResponse) {}
  rpc lockObject(LockRequest) returns (BoolResponse) {}
  rpc unlockObject(UnLockRequest) returns (BoolResponse) {}
  rpc setTtl(TtlRequest) returns (BoolResponse) {}
  rpc updateValue(UpdateRequest) returns (BoolResponse) {}
  rpc createKeyValue(CreateRequest) returns (BoolResponse) {}
  rpc remove(GetRequest) returns (BoolResponse) {}

  rpc createContainer(CreateContainerRequest) returns (BoolResponse) {}
  rpc updateValueInContainer(UpdateContainerRequest) returns (BoolResponse) {}

  rpc removeTail(GetRequest) returns (BoolResponse) {}
  rpc removeHead(GetRequest) returns (BoolResponse) {}
  rpc removeElementAtPosition(KeyPositionRequest) returns (BoolResponse) {}
  rpc removeFromContainerByKeyValue(RemoveFromContainerRequest) returns (BoolResponse) {}
  rpc removeInContainer(ContainerGetRequest) returns (BoolResponse) {}

  rpc addElementToTail(AddToRequest) returns (BoolResponse) {}
  rpc addElementToHead(AddToRequest) returns (BoolResponse) {}
  rpc addElement(AddToRequest) returns (BoolResponse) {}
  rpc addElementToPositionByValue(AddToValRequest) returns (BoolResponse) {}

  rpc atomicExchange(CreateRequest) returns (BoolResponse) {}
  rpc atomicAdd(CreateRequest) returns (BoolResponse) {}
  rpc atomicSub(CreateRequest) returns (BoolResponse) {}
  rpc atomicOr(CreateRequest) returns (BoolResponse) {}
  rpc atomicAnd(CreateRequest) returns (BoolResponse) {}
  rpc atomicXor(CreateRequest) returns (BoolResponse) {}

  rpc atomicCompareAndSet(AtomicCas) returns (BoolResponse) {}
}

// ============================================================================
// HurriCacheGrpcService — High-performance public cache service
// ============================================================================
service HurriCacheGrpcService {

  // --------------------------------------------------------------------------
  // Lock Management
  // Supported targets: ALL types (Scalar, VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET)
  // --------------------------------------------------------------------------
  rpc lockObject(LockRequest) returns (LockResponse) {}
  rpc unlockObject(UnLockRequest) returns (UnlockResponse) {}

  // --------------------------------------------------------------------------
  // TTL Management
  // Supported targets: ALL types
  // --------------------------------------------------------------------------
  rpc setTtl(TtlRequest) returns (BoolResponse) {}
  rpc getTtl(GetRequest) returns (TtlResponse) {}

  // --------------------------------------------------------------------------
  // Key-Value Operations (Basic operations)
  // Supported targets: SCALAR VALUE
  // --------------------------------------------------------------------------
  rpc createKeyValue(CreateRequest) returns (KeyHintResponse) {}
  rpc getValue(GetRequest) returns (ValueResponse) {}
  rpc getAndDeleteValue(GetRequest) returns (ValueResponse) {}
  rpc existKey(GetRequest) returns (BoolResponse) {}
  rpc updateValue(UpdateRequest) returns (UpdateValueResponse) {}
  rpc remove(GetRequest) returns (BoolResponse) {}

  // --------------------------------------------------------------------------
  // Container Management & Streaming
  // Supported targets: VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
  // --------------------------------------------------------------------------
  rpc createContainer(CreateContainerRequest) returns (KeyHintResponse) {}
  rpc getContainer(GetRequest) returns (stream BatchValueResponse) {}
  rpc getSize(GetRequest) returns (IntResponse) {}

  // --------------------------------------------------------------------------
  // Boundary & Positional Reads
  // Supported targets: VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
  // --------------------------------------------------------------------------
  rpc getTail(GetRequest) returns (ValueResponse) {}          // VECTOR, LIST, QUEUE
  rpc getHead(GetRequest) returns (ValueResponse) {}          // VECTOR, LIST, QUEUE
  rpc getValueInContainerByKey(ContainerGetRequest) returns (ValueResponse) {} // MAP, ORDERED_MAP
  rpc getElementAtPosition(KeyPositionRequest) returns (ValueResponse) {}     // VECTOR, LIST, ORDERED_SET
  rpc existInContainerByKey(ContainerGetRequest) returns (BoolResponse) {}     // MAP, ORDERED_MAP, SET, ORDERED_SET

  // --------------------------------------------------------------------------
  // Pop Operations (Extraction with removal)
  // Supported targets: VECTOR, LIST, QUEUE, ORDERED_SET, MAP, ORDERED_MAP
  // --------------------------------------------------------------------------
  rpc getAndDeleteHead(GetRequest) returns (ValueResponse) {}          // VECTOR, LIST, QUEUE
  rpc getAndDeleteTail(GetRequest) returns (ValueResponse) {}          // VECTOR, LIST, QUEUE
  rpc getAndDeleteElementAtPosition(KeyPositionRequest) returns (ValueResponse) {} // VECTOR, LIST, ORDERED_SET, ORDERED_MAP
  rpc getAndDeleteValueInContainer(ContainerGetRequest) returns (ValueResponse) {} // MAP, ORDERED_MAP
  rpc updateValueInContainer(UpdateContainerRequest) returns (UpdateValueResponse) {} // MAP, ORDERED_MAP

  // --------------------------------------------------------------------------
  // Range Reads
  // Supported targets: VECTOR, LIST, ORDERED_MAP, ORDERED_SET
  // --------------------------------------------------------------------------
  rpc getElementsInRange(KeyPositionRequest) returns (stream BatchValueResponse) {}
  rpc getAndDeleteElementsInRange(KeyPositionRequest) returns (stream BatchValueResponse) {}
  // --------------------------------------------------------------------------
  // Deletion Operations
  // Supported targets: VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
  // --------------------------------------------------------------------------
  rpc deleteHead(GetRequest) returns (IntResponse) {}          // VECTOR, LIST, QUEUE
  rpc deleteTail(GetRequest) returns (IntResponse) {}          // VECTOR, LIST, QUEUE
  rpc deleteElementAtPosition(KeyPositionRequest) returns (IntResponse) {} // VECTOR, LIST, ORDERED_SET, ORDERED_MAP
  rpc deleteFromContainerByKeyValue(RemoveFromContainerRequest) returns (IntResponse) {} // VECTOR, LIST, SET, MAP, ORDERED_MAP, ORDERED_SET
  rpc deleteFromContainerByKey(ContainerGetRequest) returns (IntResponse) {} // VECTOR, LIST, SET, MAP, ORDERED_MAP, ORDERED_SET

  // --------------------------------------------------------------------------
  // Insertion Operations
  // Supported targets: VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
  // --------------------------------------------------------------------------
  rpc addElementToTail(AddToRequest) returns (IntResponse) {}         // VECTOR, LIST, QUEUE
  rpc addElementToHead(AddToRequest) returns (IntResponse) {}         // VECTOR, LIST, QUEUE
  rpc addElement(AddToRequest) returns (IntResponse) {}               // VECTOR, LIST, QUEUE, SET, MAP, ORDERED_MAP, ORDERED_SET
  rpc addElementToPositionByValue(AddToValRequest) returns (IntResponse) {} // VECTOR, LIST

  // --------------------------------------------------------------------------
  // Atomic Primitives (Atomic Lock-Free operations)
  // Supported targets: SCALAR VALUES (INT and DOUBLE; containers are not supported)
  // --------------------------------------------------------------------------
  rpc atomicExchange(CreateRequest) returns (ValueResponse) {}
  rpc atomicAdd(CreateRequest) returns (ValueResponse) {}
  rpc atomicSub(CreateRequest) returns (ValueResponse) {}
  rpc atomicOr(CreateRequest) returns (ValueResponse) {}
  rpc atomicAnd(CreateRequest) returns (ValueResponse) {}
  rpc atomicXor(CreateRequest) returns (ValueResponse) {}
  rpc atomicCompareAndSet(AtomicCas) returns (AtomicCasRes) {}

}