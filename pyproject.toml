[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hurricache"
version = "0.1.0"
description = "HurriCache Python gRPC Client"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60,<2",
    "protobuf>=4.25,<8",
    "lz4>=4.3,<5",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60,<2",
    "pytest>=7,<10",
    "pytest-asyncio>=0.23,<2",
    "build>=1,<2",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["hurricache"]
ignore_missing_imports = true
# grpcio-tools does not emit .pyi files, so generated message attributes are
# intentionally dynamic from mypy's perspective.
disable_error_code = ["attr-defined", "name-defined"]

[tool.setuptools.packages.find]
include = ["hurricache*"]
